<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bloom">
  <!-- Hand-written vector twin of scripts/gen-icons.mjs: sunrise gradient + white flower with a check. -->
  <defs>
    <linearGradient id="sky" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FF6F91"/>
      <stop offset="0.5" stop-color="#FF9671"/>
      <stop offset="1" stop-color="#FFC75F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heart" cx="0.4" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#AA3C28" flood-opacity="0.22"/>
    </filter>
    <ellipse id="petal" cx="0" cy="-84.5" rx="48.6" ry="64"/>
  </defs>
  <circle cx="256" cy="256" r="251" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="251" fill="url(#glow)"/>
  <g transform="translate(256 256)" filter="url(#shadow)">
    <g fill="#fff">
      <use href="#petal"/>
      <use href="#petal" transform="rotate(72)"/>
      <use href="#petal" transform="rotate(144)"/>
      <use href="#petal" transform="rotate(216)"/>
      <use href="#petal" transform="rotate(288)"/>
    </g>
    <circle r="60" fill="url(#heart)"/>
    <path d="M-27 1 L-8 20 L29 -19" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
